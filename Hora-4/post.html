
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Formulário POST</title>
</head>
<body>

    <h1>Criar Aluno - POST</h1>

    <form action="resultado.html" method="POST">
        <label>Nome:</label>
        <input type="text" name="nome" required>

        <br><br>

        <label>Idade:</label>
        <input type="number" name="idade" required>

        <br><br>

        <button type="submit">Criar Aluno</button>
    </form>

</body>
</html>
