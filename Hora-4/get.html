
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Formulário GET</title>
</head>
<body>

    <h1>Pesquisar Aluno - GET</h1>

    <form action="resultado.html" method="GET">
        <label>Nome:</label>
        <input type="text" name="nome" required>

        <br><br>

        <label>Idade:</label>
        <input type="number" name="idade" required>

        <br><br>

        <button type="submit">Pesquisar</button>
    </form>

</body>
</html>
